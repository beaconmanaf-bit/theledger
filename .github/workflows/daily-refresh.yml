name: Daily price refresh

# Runs automatically every weekday at 6:00 PM IST (12:30 PM UTC),
# after the NSE market closes at 3:30 PM IST.
# You can also trigger it manually from the "Actions" tab any time.
on:
  schedule:
    - cron: "30 12 * * 1-5"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas yfinance

      - name: Run the refresh script
        run: python refresh_prices.py

      - name: Commit and push the updated data
        run: |
          git config user.name "ledger-bot"
          git config user.email "ledger-bot@users.noreply.github.com"
          git add stocks.json
          git diff --quiet --cached || git commit -m "Daily price refresh"
          git push
